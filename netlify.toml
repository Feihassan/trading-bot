# Backend is a Cloudflare Tunnel quick-tunnel pointed at the real backend
# running natively on the Windows machine next to the MT5 terminal, so
# this gets REAL live account/position/signal data (unlike render.yaml's
# Render deploy, which has no MT5 terminal available - see README).
#
# CAVEAT 1 - fragile URL: this is an account-less Cloudflare "quick
# tunnel" (no uptime guarantee, per Cloudflare's own docs). Its URL is
# regenerated every time `cloudflared` restarts or the Windows machine
# reboots - when that happens, this redirect target goes stale and must
# be updated + redeployed. For anything long-lived, replace this with a
# named Cloudflare Tunnel tied to a real domain (needs a Cloudflare
# account with a zone) instead of a quick tunnel.
# CAVEAT 2 - WebSocket: Netlify's redirect proxying does not support
# WebSocket upgrades regardless of target, so /ws/live will not actually
# connect through this proxy - the "Live feed" badge stays on
# "Reconnecting...". Everything else (REST polling) works.
# CAVEAT 3 - matching key: VITE_API_KEY (Netlify env var, build-time)
# must match this backend's local .env API_KEY, not render.yaml's.

[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/api/*"
  to = "https://laptop-raymond-band-herbs.trycloudflare.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/ws/*"
  to = "https://laptop-raymond-band-herbs.trycloudflare.com/ws/:splat"
  status = 200
  force = true

# React Router uses browser history (BrowserRouter), so a direct load or
# refresh on any client-side route (e.g. /markets, /risk) must fall back
# to index.html rather than 404 on Netlify's static file server. Must come
# after the /api and /ws rules above - first match wins.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
