# Backend is deployed on Render (see render.yaml) - MT5-dependent endpoints
# return a clean error there since there's no MT5 terminal on Linux, but
# /api/status, /api/risk, and /api/logs work for real. These proxy rules
# forward same-origin requests from this Netlify site to that backend, so
# the frontend's `const BASE = "/api"` in api.js needs no code change.
#
# CAVEAT: Netlify's redirect proxying does not support WebSocket upgrades,
# so /ws/live will not actually connect through this proxy - the "Live
# feed" badge will show "Reconnecting..." permanently on this deployment.
# Everything else (REST polling) works. Fixing this for real requires
# either a WebSocket-capable edge/proxy in front of the backend, or
# pointing VITE_WS_BASE directly at the Render backend's wss:// origin
# (CORS/WS origin allowlist on the backend would need updating too).

[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/api/*"
  to = "https://trading-bot-api-bb6i.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/ws/*"
  to = "https://trading-bot-api-bb6i.onrender.com/ws/:splat"
  status = 200
  force = true

# React Router uses browser history (BrowserRouter), so a direct load or
# refresh on any client-side route (e.g. /markets, /risk) must fall back
# to index.html rather than 404 on Netlify's static file server. Must come
# after the /api and /ws rules above - first match wins.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
