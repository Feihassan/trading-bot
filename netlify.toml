# The backend runs natively on the Windows machine next to the MT5
# terminal (render.yaml's Render deploy has no MT5 - see README) and is
# exposed with Tailscale Funnel at the machine's permanent
# https://<machine>.<tailnet>.ts.net address. That address is NOT
# hardcoded here:
#
# - scripts/watchdog.ps1 (started at logon by scripts/install-autostart.ps1)
#   keeps the backend running and makes sure the VITE_BACKEND_URL Netlify
#   env var holds the Funnel address, rebuilding only if it had to change it.
# - The build writes dist/_redirects proxying /api/* to that URL
#   (frontend/scripts/write-redirects.mjs).
# - /ws/live connects straight to VITE_BACKEND_URL from the browser,
#   because Netlify's proxy can't carry WebSocket upgrades.
#
# VITE_API_KEY (Netlify env var, build-time) must match the local .env API_KEY.

[build]
  base = "frontend"
  command = "npm run build && node scripts/write-redirects.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# React Router uses browser history (BrowserRouter), so a direct load or
# refresh on any client-side route (e.g. /markets, /risk) must fall back
# to index.html rather than 404 on Netlify's static file server. The /api
# proxy rule lives in the generated _redirects, which Netlify evaluates first.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
