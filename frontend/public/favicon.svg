<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#0b0f17"/>
  <!-- candlesticks, kept within the maskable-safe inner ~70% zone -->
  <g stroke-linecap="round">
    <!-- candle 1: down (sell), short -->
    <line x1="146" y1="196" x2="146" y2="276" stroke="#ef4444" stroke-width="6"/>
    <rect x="126" y="216" width="40" height="40" rx="4" fill="#ef4444"/>

    <!-- candle 2: down (sell), tall -->
    <line x1="216" y1="176" x2="216" y2="336" stroke="#ef4444" stroke-width="6"/>
    <rect x="196" y="216" width="40" height="80" rx="4" fill="#ef4444"/>

    <!-- candle 3: up (buy), tall -->
    <line x1="286" y1="156" x2="286" y2="316" stroke="#22c55e" stroke-width="6"/>
    <rect x="266" y="176" width="40" height="100" rx="4" fill="#22c55e"/>

    <!-- candle 4: up (buy), tallest -->
    <line x1="356" y1="116" x2="356" y2="276" stroke="#22c55e" stroke-width="6"/>
    <rect x="336" y="136" width="40" height="120" rx="4" fill="#22c55e"/>
  </g>
</svg>
